<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>NEXA Supermarket 3D</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font:14px system-ui;background:#15232b;color:white}canvas{display:block}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}.card{background:#07131ddd;border:1px solid #ffffff30;border-radius:12px;padding:9px 12px}.brand{font-weight:900;color:#68e3b2;font-size:16px}#controls{position:fixed;bottom:18px;right:14px;display:flex;gap:9px;flex-direction:column}button{border:0;border-radius:13px;padding:14px;background:#68e3b2;color:#06261c;font-weight:900}#stick{position:fixed;left:18px;bottom:20px;width:120px;height:120px;border:2px solid #ffffff55;background:#07131d99;border-radius:50%;touch-action:none}#nub{position:absolute;left:34px;top:34px;width:48px;height:48px;background:#68e3b2dd;border-radius:50%}#help{position:fixed;top:94px;left:50%;transform:translateX(-50%);background:#07131ddd;padding:9px;border-radius:10px;text-align:center;width:max-content;max-width:92%}#toast{position:fixed;top:48%;left:50%;transform:translate(-50%,-50%);background:#07131df2;border:1px solid #68e3b2;border-radius:12px;padding:16px;display:none}
</style></head><body><div id="hud"><div class="card"><div class="brand">🛒 NEXA SUPERMARKET</div>3D BUSINESS SIMULATOR</div><div class="card">Cash <b id="cash">₨5,000</b></div><div class="card">Sales <b id="sales">₨0</b></div><div class="card">Stock <b id="stock">24</b></div></div><div id="help">Joystick/WASD se chalein · Shelf ke paas ja kar Interact karein</div><div id="stick"><div id="nub"></div></div><div id="controls"><button id="restock">📦 Restock ₨500</button><button id="act">🛍️ Interact / Sell</button></div><div id="toast"></div>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new T.Scene();scene.background=new T.Color(0x9bd9f3);scene.fog=new T.Fog(0x9bd9f3,24,55);
const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);renderer.domElement.style.position='fixed';renderer.domElement.style.inset='0';renderer.domElement.style.zIndex='0';
document.querySelectorAll('#hud,#help,#stick,#controls,#toast').forEach(e=>e.style.zIndex='2');
scene.add(new T.HemisphereLight(0xffffff,0x73806b,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(-5,12,8);light.castShadow=true;scene.add(light);
const M=c=>new T.MeshStandardMaterial({color:c,roughness:.8});function box(x,y,z,w,h,d,c){let o=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
box(0,-.18,0,22,.35,22,0xe7e9e4);box(0,3,-10.8,22,6,.35,0xf5f4eb);box(-10.8,3,0,.35,6,22,0xf5f4eb);box(10.8,3,0,.35,6,22,0xf5f4eb);box(0,4.8,-10.55,7,1.2,.12,0x1d3945);box(0,4.1,-10.45,6,.08,.1,0x68e3b2);
const colors=[0xf05d5e,0xffc857,0x5ba7e8,0x65c18c,0xb58be8,0xffffff],shelves=[];
for(let z=-6;z<=2;z+=4)for(let x of [-5,0,5]){let g=new T.Group();g.position.set(x,0,z);let b=new T.Mesh(new T.BoxGeometry(2.5,2.5,.75),M(0x1d3945));b.position.y=1.25;g.add(b);for(let l=0;l<3;l++){let p=new T.Mesh(new T.BoxGeometry(2.7,.09,.95),M(0x68e3b2));p.position.set(0,.48+l*.72,.05);g.add(p);for(let i=0;i<6;i++){let q=new T.Mesh(new T.BoxGeometry(.27,.32,.3),M(colors[(i+l+Math.abs(z))%colors.length]));q.position.set(-1.02+i*.41,.68+l*.72,.06);g.add(q)}}scene.add(g);shelves.push({x,z})}
box(5,.58,8,4,.95,1.5,0x26343b);box(5,1.1,8,4.1,.12,1.6,0x68e3b2);box(4.3,1.4,7.8,.65,.42,.5,0x252a30);box(0,.02,9.7,5,.04,1.3,0x68e3b2);
const player=new T.Group();scene.add(player);let body=new T.Mesh(new T.CapsuleGeometry(.34,.65,4,8),M(0x167c80));body.position.y=.82;player.add(body);let head=new T.Mesh(new T.SphereGeometry(.25,16,12),M(0xf0c49a));head.position.y=1.48;player.add(head);player.position.set(0,0,7);
const customers=[];function customer(x,z,c){let g=new T.Group();g.position.set(x,0,z);let b=new T.Mesh(new T.CapsuleGeometry(.3,.6,3,7),M(c));b.position.y=.75;g.add(b);let h=new T.Mesh(new T.SphereGeometry(.23,12,10),M(0xd8a77d));h.position.y=1.4;g.add(h);scene.add(g);customers.push({g,goal:new T.Vector3(x,0,z),wait:2+Math.random()*4})}customer(-7,7,0xe7a34c);customer(7,-3,0xd66e9a);customer(-7,-2,0x598ee0);
let cash=5000,sales=0,stock=24;const $=id=>document.getElementById(id);function ui(){$('cash').textContent='₨'+cash.toLocaleString();$('sales').textContent='₨'+sales.toLocaleString();$('stock').textContent=stock}function toast(s){$('toast').textContent=s;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800)}
function act(){let best=99,kind='shelf';for(let s of shelves){let d=Math.hypot(player.position.x-s.x,player.position.z-s.z);if(d<best){best=d;kind='shelf'}}let d=Math.hypot(player.position.x-5,player.position.z-8);if(d<best){best=d;kind='checkout'}if(best>3){toast('Shelf ya checkout ke paas jao!');return}if(kind==='shelf'){if(cash<250||stock>55){toast('Cash kam hai ya stock full hai');return}cash-=250;stock+=12;toast('12 products khareed liye!')}else{if(stock<1){toast('Stock khatam! Restock karein');return}let n=Math.min(4,stock);stock-=n;cash+=n*90;sales+=n*90;toast(n+' items sell huay: +₨'+n*90)}ui()}
$('act').onclick=act;$('restock').onclick=()=>{if(cash<500){toast('Cash kam hai');return}cash-=500;stock+=20;toast('Wholesale delivery: +20 stock');ui()};
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')act()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let joy={x:0,y:0},on=false,stick=$('stick'),nub=$('nub');function jm(e){let r=stick.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),l=Math.hypot(dx,dy),m=36;if(l>m){dx*=m/l;dy*=m/l}joy.x=dx/m;joy.y=dy/m;nub.style.transform='translate('+dx+'px,'+dy+'px)'}stick.addEventListener('pointerdown',e=>{on=true;stick.setPointerCapture(e.pointerId);jm(e)});stick.addEventListener('pointermove',e=>{if(on)jm(e)});function end(){on=false;joy={x:0,y:0};nub.style.transform=''}stick.addEventListener('pointerup',end);stick.addEventListener('pointercancel',end);
let last=performance.now();function loop(now){requestAnimationFrame(loop);let dt=Math.min((now-last)/1000,.04);last=now;let f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0)-joy.y,side=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x,l=Math.hypot(f,side);if(l>.05){f/=Math.max(1,l);side/=Math.max(1,l);player.position.x+=side*4*dt;player.position.z-=f*4*dt;player.rotation.y=Math.atan2(side,f)}player.position.x=T.MathUtils.clamp(player.position.x,-9.5,9.5);player.position.z=T.MathUtils.clamp(player.position.z,-9.5,9.5);for(let c of customers){c.wait-=dt;if(c.wait<0){c.goal.set((Math.random()-.5)*14,0,(Math.random()-.5)*14);c.wait=4+Math.random()*4}let dx=c.goal.x-c.g.position.x,dz=c.goal.z-c.g.position.z,d=Math.hypot(dx,dz);if(d>.2){c.g.position.x+=dx/d*dt*.6;c.g.position.z+=dz/d*dt*.6}}camera.position.lerp(new T.Vector3(player.position.x,4.2,player.position.z+6.3),.09);camera.lookAt(player.position.x,1,player.position.z-1);renderer.render(scene,camera)}requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});ui();
</script></body></html>
