name: Refresh Pakistan Jobs
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: pip install requests beautifulsoup4
      - name: Validate scraper syntax
        run: python -m py_compile scripts/fetch_jobs.py
      - name: Fetch public job listings
        run: python scripts/fetch_jobs.py
      - name: Commit updated jobs data
        run: |
          if git diff --quiet -- data/jobs.json; then
            echo "No job data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Refresh Pakistan jobs feed"
          git push
