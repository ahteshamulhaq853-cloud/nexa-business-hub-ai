name: Refresh jobs feed

on:
  push:
    paths:
      - ".github/workflows/refresh-jobs.yml"
      - "scripts/update_jobs.py"
  schedule:
    # Every 6 hours, offset from the top of the hour to reduce scheduling delays.
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-jobs-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh job listings
        run: python scripts/update_jobs.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/jobs.json; then
            echo "Jobs feed did not change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json
          git commit -m "Automate jobs feed refresh"
          git push
