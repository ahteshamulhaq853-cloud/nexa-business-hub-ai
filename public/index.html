
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexa Business Hub</title>
<style>
/* CV Skills bullet formatting */
.cv-body,
.cv-contact,
.side-text {
  font-size: 15px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  word-break: break-word;
}
.cv-name { font-size: 28px; }
.cv-title { font-size: 12px; }

@page {
  size: A4 portrait;
  margin: 5mm;
}

@media print {
  .topbar, .sidebar, .page-heading, .form-panel,
  .preview-label, footer, .no-print {
    display: none !important;
  }

  .layout, main, #cvView, .cv-workspace {
    display: block !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .view { display: none !important; }
  #cvView { display: block !important; }

  .cv-paper {
    display: grid !important;
    grid-template-columns: 32% 68% !important;
    width: 100% !important;
    min-height: 0 !important;
    margin: 0 !important;
    border: 0 !important;
    box-shadow: none !important;
  }

  .cv-sidebar { padding: 10px 8px !important; }
  .cv-content { padding: 12px 10px !important; }
  .cv-body, .cv-contact, .side-text {
    font-size: 15px !important;
    line-height: 1.3 !important;
  }

  .cv-photo {
    width: 85px !important;
    height: 95px !important;
  }

  .cv-section { margin-top: 10px !important; }
  .cv-section h3 { padding: 5px 6px !important; }
}
</style>
</head>
<body>

<!-- Apni existing website ka HTML yahan rakhein. -->

<script>
/* Har skill ke shuru mein bullet lagane ka function */
function formatSkills(value) {
  return value
    .split("\n")
    .map(skill => skill.trim().replace(/^[•\-–\s]+/, "").trim())
    .filter(Boolean)
    .map(skill => "• " + skill)
    .join("\n");
}

/* Apne existing CV code mein skills preview update karne ke liye */
function updateSkillsPreview() {
  const input = document.getElementById("cvSkills");
  const preview = document.getElementById("prevSkills");

  if (input && preview) {
    preview.textContent = formatSkills(input.value);
  }
}

const skillsInput = document.getElementById("cvSkills");
if (skillsInput) {
  skillsInput.addEventListener("input", updateSkillsPreview);
  updateSkillsPreview();
}
</script>

</body>
</html>
